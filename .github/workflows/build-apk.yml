name: Build Risk Assessment APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Prepare complete Android project
        env:
          ANDROID_SOURCE_ZIP: ""
        run: |
          python3 - <<'PYCODE'
          import base64, io, os, zipfile
          from pathlib import PurePosixPath
          raw = base64.b64decode(os.environ['ANDROID_SOURCE_ZIP'], validate=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              for name in archive.namelist():
                  path = PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts:
                      raise ValueError('Unsafe project path')
              archive.extractall('.')
          PYCODE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare preinstalled Android SDK
        run: python3 ci/setup-sdk.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and lint
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android installed-app checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: python3 ci/run-smoke.py
      - name: Prepare APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/risk-assessment.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose output/risk-assessment.apk
          sha256sum output/risk-assessment.apk > output/SHA256SUMS.txt
      - name: Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: risk-assessment-apk
          path: output/
          if-no-files-found: error
          retention-days: 14
      - name: Validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-assessment-validation
          path: |
            validation-results/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
